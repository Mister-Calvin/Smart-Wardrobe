<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Outfit Input</title>
</head>
<body>

<form action="/input" method="post">
  <input type="text" name="user_input" placeholder="Was soll ich anziehen?" required>
  <button type="submit">Absenden</button>

  <details>
    <summary>Kontext hinzufügen</summary>

    <p>
      <label>Event:</label><br>
      <select name="event_input">
        <option value="">-- wählen --</option>

        <optgroup label="Arbeit / Büro">
          <option value="arbeit">arbeit</option>
          <option value="büro">büro</option>
          <option value="office">office</option>
          <option value="meeting">meeting</option>
          <option value="termin">termin</option>
          <option value="kunden">kunden</option>
        </optgroup>

        <optgroup label="Formal">
          <option value="formal">formal</option>
          <option value="hochzeit">hochzeit</option>
          <option value="gala">gala</option>
          <option value="anzug">anzug</option>
          <option value="feierlich">feierlich</option>
        </optgroup>

        <optgroup label="Sport / Training">
          <option value="gym">gym</option>
          <option value="fitness">fitness</option>
          <option value="training">training</option>
          <option value="workout">workout</option>
          <option value="laufen">laufen</option>
          <option value="joggen">joggen</option>
          <option value="sport">sport</option>
        </optgroup>

        <optgroup label="Date / Essen">
          <option value="date">date</option>
          <option value="dinner">dinner</option>
          <option value="essen">essen</option>
          <option value="restaurant">restaurant</option>
        </optgroup>

        <optgroup label="Sonstiges (deine bisherigen Werte)">
          <option value="Vorstellungsgespräch">Vorstellungsgespräch</option>
          <option value="Alltag">Alltag</option>
          <option value="Feier">Feier</option>
        </optgroup>
      </select>
    </p>

    <p>
      <label>Location:</label><br>
      <select name="location_input">
        <option value="">-- wählen --</option>
        <option value="Büro">Büro</option>
        <option value="Outdoor">Outdoor</option>
        <option value="Restaurant">Restaurant</option>
        <option value="Zuhause">Zuhause</option>
      </select>
    </p>

    <p>
      <label>Season:</label><br>
      <select name="season_input">
        <option value="">-- wählen --</option>
        <option value="Winter">Winter</option>
        <option value="Frühling">Frühling</option>
        <option value="Sommer">Sommer</option>
        <option value="Herbst">Herbst</option>
      </select>
    </p>

    <p>
      <label>Weather:</label><br>
      <select name="weather_input">
        <option value="">-- wählen --</option>

        <optgroup label="Regen">
          <option value="regen">regen</option>
          <option value="regnerisch">regnerisch</option>
          <option value="nass">nass</option>
          <option value="schauer">schauer</option>
          <option value="sprühregen">sprühregen</option>
        </optgroup>

        <optgroup label="Kalt / Schnee / Frost">
          <option value="kalt">kalt</option>
          <option value="kühl">kühl</option>
          <option value="frost">frost</option>
          <option value="frostig">frostig</option>
          <option value="schnee">schnee</option>
          <option value="eisig">eisig</option>
          <option value="frieren">frieren</option>
        </optgroup>

        <optgroup label="Warm / Hitze / Schwül">
          <option value="warm">warm</option>
          <option value="heiß">heiß</option>
          <option value="hitze">hitze</option>
          <option value="schwül">schwül</option>
        </optgroup>

        <optgroup label="Wind / Sturm">
          <option value="wind">wind</option>
          <option value="windig">windig</option>
          <option value="sturm">sturm</option>
          <option value="stürmisch">stürmisch</option>
        </optgroup>
      </select>
    </p>

    <p>
      <label>Mood:</label><br>
      <select name="mood_input">
        <option value="">-- wählen --</option>

        <optgroup label="Gemütlich / entspannt">
          <option value="gemütlich">gemütlich</option>
          <option value="comfy">comfy</option>
          <option value="entspannt">entspannt</option>
          <option value="chillig">chillig</option>
          <option value="cozy">cozy</option>
          <option value="locker">locker</option>
        </optgroup>

        <optgroup label="Selbstbewusst / mutig">
          <option value="selbstbewusst">selbstbewusst</option>
          <option value="mutig">mutig</option>
          <option value="bold">bold</option>
          <option value="auffällig">auffällig</option>
          <option value="statement">statement</option>
        </optgroup>

        <optgroup label="Minimalistisch / clean">
          <option value="minimal">minimal</option>
          <option value="minimalistisch">minimalistisch</option>
          <option value="clean">clean</option>
          <option value="schlicht">schlicht</option>
          <option value="basic">basic</option>
        </optgroup>

        <optgroup label="Verspielt / fun">
          <option value="verspielt">verspielt</option>
          <option value="fun">fun</option>
          <option value="bunt">bunt</option>
          <option value="fröhlich">fröhlich</option>
          <option value="spielerisch">spielerisch</option>
        </optgroup>
      </select>
    </p>

    <p>
      <label>
        <input type="checkbox" name="complete_outfit" value="1">
        Outfit vervollständigen (Top, Bottom & Schuhe sicherstellen)
      </label>
    </p>

  </details>

  <details>
    <summary>Filter hinzufügen</summary>

    <p>
      <label>Farben (OR, z.B. "schwarz, blau"):</label><br>
      <input type="text" name="colors_any" placeholder='z.B. schwarz, blau'>
    </p>

    <p>
      <label>Farben (AND, z.B. "schwarz weiß"):</label><br>
      <input type="text" name="colors_all" placeholder='z.B. schwarz weiß'>
    </p>

    <p>
      <label>Score (exakt):</label><br>
      <input type="number" name="score" placeholder="z.B. 7" min="0" max="10">
    </p>

    <p>
      <label>Score min:</label><br>
      <input type="number" name="score_min" placeholder="z.B. 6" min="0" max="10">
    </p>

    <p>
      <label>Score max:</label><br>
      <input type="number" name="score_max" placeholder="z.B. 9" min="0" max="10">
    </p>

    <p>
      <label>Zustand (OR, z.B. "neu, gut"):</label><br>
      <input type="text" name="condition_any" placeholder='z.B. neu, gut'>
    </p>

    <p>
      <label>Name enthält (AND, nur Name, z.B. "hoodie oversized"):</label><br>
      <input type="text" name="name_contains" placeholder='z.B. hoodie oversized'>
    </p>

    <p>
      <label>Description enthält (AND, nur Description, z.B. "baumwolle"):</label><br>
      <input type="text" name="description_contains" placeholder='z.B. baumwolle'>
    </p>

    <p>
      <label>Text ALL (AND, muss in Name ODER Description vorkommen):</label><br>
      <input type="text" name="text_all" placeholder='z.B. hoodie wolle'>
    </p>

    <p>
      <label>Text ANY (OR, mindestens ein Term muss vorkommen):</label><br>
      <input type="text" name="text_any" placeholder='z.B. hoodie, wolle'>
    </p>

    <p>
      <label>Limit (z.B. 20):</label><br>
      <input type="number" name="limit" placeholder="z.B. 20" min="1">
    </p>

  </details>
</form>

</body>
</html>
