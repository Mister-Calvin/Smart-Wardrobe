{% extends "base.html" %}

{% block content %}
    <div class="page-header">
        <h1>Kleidungsstück bearbeiten</h1>
        <a href="/" class="btn-secondary">Zurück zum Kleiderschrank</a>
    </div>

    <form method="post" action="/items/{{ item.id }}/edit" class="form-card">

        <div class="form-group">
            <label for="name">Name des Kleidungsstücks</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                value="{{ item.name }}"
            >
        </div>

        <div class="form-group">
            <label for="description">Beschreibung</label>
            <input
                type="text"
                id="description"
                name="description"
                required
                value="{{ item.description }}"
            >
        </div>

         <div class="form-group">
            <label for="color">Farbe</label>
            <input
                type="text"
                id="color"
                name="color"
                required
                value="{{ item.color }}"
            >
        </div>

         <div class="form-group">
            <label for="condition">Zustand</label>
            <input
                type="text"
                id="condition"
                name="condition"
                required
                value="{{ item.condition }}"
            >
        </div>

         <div class="form-group">
            <label for="type">Typ</label>
            <input
                type="text"
                id="type"
                name="type"
                required
                value="{{ item.type }}"
            >
        </div>

         <div class="form-group">
            <label for="score">SCORE</label>
            <input
                type="text"
                id="score"
                name="score"
                required
                value="{{ item.score }}"
            >
        </div>

        <button type="submit" class="btn-primary">
            Änderungen speichern
        </button>

    </form>
{% endblock %}
